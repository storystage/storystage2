<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />

    <title>Spike 1.2: characters in Babylon.js</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 1rem;

      canvas {
        width: 100%;

        aspect-ratio: 16 / 9;

        background: #ccd;
      }

      label {
        font-size: 1rem;
        margin: 0.5rem 0.5rem 0.5rem 0;

      <label
        >Or open a model from this device (.glb): <input id="file" type="file" accept=".glb,.gltf"
      /></label>
    </p>
    <canvas id="stage"></canvas>
    <pre id="out">Ready.</pre>
    <script type="module" src="/src/main.ts"></script>

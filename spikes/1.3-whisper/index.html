<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spike 1.3: speech to text on the device</title>
    <!-- Makes the page cross-origin isolated on GitHub Pages (whisper uses threads). -->
    <script src="coi-serviceworker.min.js"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 1rem;
        max-width: 50rem;
      }
      button,
      select {
        font-size: 1rem;
        margin: 0.4rem 0.4rem 0.4rem 0;
      }
    </style>
  </head>
  <body>
    <h1>Spike 1.3: speech to text on the device</h1>
    <p>
      whisper.cpp runs inside this page. Nothing you say is sent anywhere: the recording stays in
      this tab.
    </p>
    <p><button id="run">Run the test clips (both models)</button></p>
    <p>
      <label
        >Model:
        <select id="model">
          <option value="tiny.en-q5_1">tiny, quantised (32 MB)</option>
          <option value="tiny.en">tiny, full (78 MB)</option>
        </select></label
      >
      <button id="talk">Talk for 5 seconds</button>
    </p>
    <pre id="out">Ready.</pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

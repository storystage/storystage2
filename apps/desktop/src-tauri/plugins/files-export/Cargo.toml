[package]
name = "tauri-plugin-files-export"
version = "0.1.0"
description = "iPad's own Files dialogs: export a copy, and pick a file to open (spec 05 section 6.5)"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"
publish = false
links = "tauri-plugin-files-export"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

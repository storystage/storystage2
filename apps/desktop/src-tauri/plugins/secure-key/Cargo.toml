[package]
name = "tauri-plugin-secure-key"
version = "0.1.0"
description = "The key's store and dialog on Android: Android Keystore and a system dialog"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"
publish = false
links = "tauri-plugin-secure-key"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

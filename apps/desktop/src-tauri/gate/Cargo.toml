[package]
name = "storystage-gate"
version = "0.1.0"
description = "The policy enforcement point: checks every Prompter request before the key is read"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"
publish = false

# No Tauri and no network here, on purpose: every refusal can be tested in seconds on any runner.
[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
storystage-policy = { path = "../policy" }

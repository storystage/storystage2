[package]
name = "storystage-policy"
version = "0.1.0"
description = "The school lock: reads the policy and works out the policy in force"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"
publish = false

# No Tauri here, on purpose: these tests run on any runner in seconds.
[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

[dev-dependencies]
serde_json = "1"

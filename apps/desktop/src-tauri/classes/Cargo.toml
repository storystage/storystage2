[package]
name = "storystage-classes"
version = "0.1.0"
description = "The native store for pupil folders: safe paths, atomic writes, and no symbolic links followed"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"
publish = false

# No Tauri here, so every rule is tested on any runner.
[dependencies]
# Collect and Hand back as one zip on iPad and Android (decision 0070). Stored and deflate only:
# none of zip's other methods, encryption or extras.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
serde_json = "1"

[package]
name = "storystage-speech"
version = "0.1.0"
description = "Speech models: the pins, the check on every load, and the optional download"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"
publish = false

# No Tauri here, so every check, and the download against a local server, is tested on any runner.
[dependencies]
futures-util = "0.3"
hex = "0.4"
# The same TLS as the transport and the updater: `ring`, with the system's certificates.
reqwest = { version = "0.13", default-features = false, features = [
  "http2",
  "rustls-no-provider",
  "stream",
  "system-proxy",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
storystage-policy = { path = "../policy" }
tokio = { version = "1", features = ["macros", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

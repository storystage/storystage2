[package]
name = "storystage-desktop"
version = "0.1.0"
description = "StoryStage 2 desktop and mobile shell"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"
publish = false

[workspace]
members = ["classes", "gate", "policy", "plugins/managed-config", "plugins/secure-key", "speech", "transport"]

[lib]
# The mobile targets load the app as a library.
name = "storystage_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# For the leak scan's harness only: a fake server. Release builds never turn this on.
test-endpoint = ["storystage-transport/test-endpoint"]

[dependencies]
tauri = { version = "2", features = [] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
storystage-classes = { path = "classes" }
storystage-gate = { path = "gate" }
storystage-policy = { path = "policy" }
storystage-speech = { path = "speech" }
storystage-transport = { path = "transport" }
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-managed-config = { path = "plugins/managed-config" }
tauri-plugin-secure-key = { path = "plugins/secure-key" }
# Reads the bundled speech model from the APK, from Rust only (spec 05 section 5.2).
tauri-plugin-fs = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
zeroize = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

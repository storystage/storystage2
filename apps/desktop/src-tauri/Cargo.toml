[package]
name = "storystage-desktop"
version = "0.1.0"
description = "StoryStage 2 desktop and mobile shell"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"
publish = false

[workspace]
members = ["classes", "gate", "policy", "plugins/files-export", "plugins/managed-config", "plugins/secure-key", "speech", "transport"]

[lib]
# The mobile targets load the app as a library.
name = "storystage_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Reads .speech/'s files.json for the pins the app checks speech files against.
serde_json = "1"

[features]
# For the leak scan's harness only: a fake server. Release builds never turn this on.
test-endpoint = ["storystage-transport/test-endpoint"]

[dependencies]
tauri = { version = "2", features = [] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
storystage-classes = { path = "classes" }
storystage-gate = { path = "gate" }
storystage-policy = { path = "policy" }
storystage-speech = { path = "speech" }
storystage-transport = { path = "transport" }
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-managed-config = { path = "plugins/managed-config" }
# Opens the files the system's dialog picks, from Rust only (spec 05 section 6.5).
tauri-plugin-fs = "2"
# Reads bundled files in place through Android's AssetManager (src/android_assets.rs, WP15c).
# All four already come in through tao and wry, at these versions.
jni = "0.21"
ndk = { version = "0.9", default-features = false }
ndk-context = "0.1"
ndk-sys = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
zeroize = "1"

[target.'cfg(target_os = "ios")'.dependencies]
# iPad's own Files dialogs, from Rust only (spec 05 section 6.5).
tauri-plugin-files-export = { path = "plugins/files-export" }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# The key's system dialog, and on Android its store (spec 05 sections 1.2, 2.1).
tauri-plugin-secure-key = { path = "plugins/secure-key" }

[target.'cfg(not(target_os = "ios"))'.dependencies]
# The system's file dialog, from Rust only (spec 05 section 6.5): desktop, and Android (0070).
tauri-plugin-dialog = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

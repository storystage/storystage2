[package]
name = "storystage-desktop"
version = "0.1.0"
description = "StoryStage 2 desktop and mobile shell"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"
publish = false

[workspace]
members = ["policy", "plugins/managed-config"]

[lib]
# The mobile targets load the app as a library.
name = "storystage_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
storystage-policy = { path = "policy" }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-managed-config = { path = "plugins/managed-config" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

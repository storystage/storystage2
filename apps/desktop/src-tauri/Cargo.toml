[package]
name = "storystage-desktop"
version = "0.1.0"
description = "StoryStage 2 desktop and mobile shell"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# The mobile targets load the app as a library.
name = "storystage_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

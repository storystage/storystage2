</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;owl&quot;,&quot;cat&quot;,&quot;tree&quot;,&quot;key&quot;,&quot;child&quot;,&quot;robot&quot;],&quot;default&quot;:&quot;owl&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;look&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sketch&quot;,&quot;colour&quot;],&quot;default&quot;:&quot;sketch&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;flip&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;sw&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:2.6,&quot;min&quot;:0.5,&quot;max&quot;:6,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;},&quot;ink&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#161412&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind || 'owl';
    const col = this.props.look === 'colour';
    const P = {
      owl: ['#8B5E3C', '#E8C795', '#FFF4D6', '#F2A93B', '#3B2414'],
      cat: ['#E48A3A', '#F6C58F', '#FFFFFF', '#F7A1A1', '#6A3410'],
      tree: ['#7A5233', '#4A9A62', '#2F7646', '#000', '#1F4A2E'],
      key: ['#E8B931', '#F6DA7A', '#fff', '#fff', '#7A5A0C'],
      child: ['#F0C29B', '#3D7BD9', '#4A2C1A', '#F2B33D', '#5A3A22'],
      robot: ['#A9BED1', '#2FB8A8', '#E8EEF4', '#F4B740', '#34475A']
    }[k] || [];
    const c = i => (col ? P[i] : '#FFFFFF');
    const show = n => (k === n ? 'inline' : 'none');
    return {
      c1: c(0), c2: c(1), c3: c(2), c4: c(3),
      ink: col ? P[4] : (this.props.ink || '#161412'),
      pupil: col ? '#1A120B' : (this.props.ink || '#161412'),
      sw: this.props.sw ?? (col ? 1.6 : 2.6),
      flipT: this.props.flip ? 'translate(100 0) scale(-1 1)' : '',
      dOwl: show('owl'), dCat: show('cat'), dTree: show('tree'), dKey: show('key'), dChild: show('child'), dRobot: show('robot')
    };
  }
}
</script>
</body>
</html>

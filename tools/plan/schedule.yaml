# StoryStage 2: the one schedule file (WP0.10).
# Every planned item, what it waits for, its estimate, the basis for the estimate and, once it
# has run, its actual dates. Workplan section 5a (tables and chart), the "Schedule items" line
# under each "Depends on" in section 6, and the session roster in handover/README.md are
# generated from this file: run `pnpm schedule` after changing it. CI fails when they disagree.
# Recalibrate the estimates at every milestone (WP1.12, docs/spikes/capacity.md).
#
# Item fields:
#   id        the item id the workplan cites; WP<n>... items belong to section 6's WP<n>
#   label     what the item is, with its task numbers
#   lane      the strand of work (the chart's sections)
#   who       C (Claude Code session), U (owner) or C+U; only C items count against the lane cap
#   weeks     estimated elapsed weeks for one lane, including owner review
#   basis     why the estimate is what it is: a key under `bases`
#   after     the items it waits for
#   started   actual start date, once it has started
#   finished  actual finish date (the last pull request merged), once it has finished

week0: 2026-10-19


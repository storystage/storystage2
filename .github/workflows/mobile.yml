# Tauri mobile builds (WP0.3): Android for Chromebooks and tablets, and iOS for iPads.
# Android produces a debug APK as a workflow artifact. iOS stays off until the Apple developer
# account exists (WP15.5): set the repository variable APPLE_DEVELOPMENT_TEAM to switch it on.
name: Mobile

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - apps/desktop/**
      - .github/workflows/mobile.yml
      - .github/actions/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          # Chromebooks are x86_64 or ARM; tablets and phones are ARM.
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: ./.github/actions/setup
      - name: Fetch the bundled speech model and check its pin (spec 05, 5.2)
        run: node apps/desktop/scripts/fetch-models.mjs
      - name: Fetch the shipped Backstage and check it against its lock (decision 0062)
        run: pnpm -w run backstage:fetch
      - name: Generate the Android project
        working-directory: apps/desktop
        # The runner image ships the Android SDK and NDK.
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" pnpm tauri android init --ci
      - name: Build a debug APK
        working-directory: apps/desktop
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" pnpm tauri android build --debug --apk --target aarch64 --target x86_64 --ci
      - name: The school's settings are in the app (spec 05, 3.2)
        working-directory: apps/desktop/src-tauri/gen/android/app/build/outputs/apk
        run: |
          apk=$(find . -name '*.apk' | head -1)
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/aapt2
          "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" | grep -q android.content.APP_RESTRICTIONS
          "$aapt2" dump xmltree --file res/xml/app_restrictions.xml "$apk" | grep -q prompter.enabled
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storystage2-android
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

  # Compiles the native layer for iPad. This needs no Apple account, so it runs from now on.
  ios-rust:
    name: ios (rust)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Fetch the bundled speech model and check its pin (spec 05, 5.2)
        run: node apps/desktop/scripts/fetch-models.mjs
      - name: Fetch the shipped Backstage and check it against its lock (decision 0062)
        run: pnpm -w run backstage:fetch
      - name: Compile for iPad
        working-directory: apps/desktop/src-tauri
        run: |
          mkdir -p ../../studio/dist
          cargo check --target aarch64-apple-ios --locked

  ios:
    name: ios
    if: vars.APPLE_DEVELOPMENT_TEAM != ''
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: ./.github/actions/setup
      - name: Fetch the bundled speech model and check its pin (spec 05, 5.2)
        run: node apps/desktop/scripts/fetch-models.mjs
      - name: Fetch the shipped Backstage and check it against its lock (decision 0062)
        run: pnpm -w run backstage:fetch
      - name: Generate the Xcode project
        working-directory: apps/desktop
        run: pnpm tauri ios init --ci
      - name: Build for iPad
        working-directory: apps/desktop
        run: pnpm tauri ios build --ci

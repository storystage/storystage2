# CodeQL for the iPad plugins' Swift (the key dialog and the Files dialogs), chosen by the owner on
# 28 Nov 2026. Default setup couldn't build it: each plugin's Package.swift needs ../.tauri/tauri-api,
# which only the plugin crate's build script makes, and only for an Apple target. So this checks the
# two plugin crates for the iPad under CodeQL's tracer: the build script copies tauri-api in, then
# compiles the plugin with `swift build` for iOS, and CodeQL extracts that.
# On macOS, so it runs only when the Swift or what it builds against changes, on main and weekly.
name: CodeQL (Swift)

on:
  push:
    branches: [main]
    paths:
      - apps/desktop/src-tauri/plugins/*/ios/**
      - apps/desktop/src-tauri/plugins/*/build.rs
      - apps/desktop/src-tauri/plugins/*/Cargo.toml
      - apps/desktop/src-tauri/Cargo.lock
      - .github/workflows/codeql-swift.yml
  pull_request:
    branches: [main]
    paths:
      - apps/desktop/src-tauri/plugins/*/ios/**
      - apps/desktop/src-tauri/plugins/*/build.rs
      - apps/desktop/src-tauri/plugins/*/Cargo.toml
      - apps/desktop/src-tauri/Cargo.lock
      - .github/workflows/codeql-swift.yml
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-swift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      # No Rust cache: a cached build script wouldn't run again, and then no Swift is compiled.
      - id: init
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: swift
          build-mode: manual
      - name: Build the plugins' Swift for iPad
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked --target aarch64-apple-ios -p tauri-plugin-secure-key -p tauri-plugin-files-export
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:swift
          upload: never # TEMPORARY: default setup is still on
          output: ${{ runner.temp }}/codeql-results
      # TEMPORARY (S8's review of #747): what went into the database and what it found.
      - name: TEMPORARY what the Swift scan read and found
        if: always()
        env:
          CODEQL: ${{ steps.init.outputs.codeql-path }}
          DB: ${{ runner.temp }}/codeql_databases/swift
          OUT: ${{ runner.temp }}/codeql-results
        run: |
          echo "::group::Source files in the database"
          unzip -Z1 "$DB/src.zip" | sort
          echo "::endgroup::"
          echo "Results: $(jq '[.runs[].results[]] | length' "$OUT/swift.sarif")"
          jq -r '.runs[].results[] | "\(.ruleId)  \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)  \(.message.text)"' "$OUT/swift.sarif"
          echo "::group::Diagnostics"
          "$CODEQL" database export-diagnostics "$DB" --format=sarif-latest --output="$OUT/diagnostics.sarif"
          jq -r '.runs[].invocations[]?.toolExecutionNotifications[]? | "\(.level // "")  \(.descriptor.id // "")  \(.message.text)"' "$OUT/diagnostics.sarif"
          echo "::endgroup::"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-swift-trial
          path: ${{ runner.temp }}/codeql-results

# Lint, type-check, unit tests and end-to-end tests on every push (WP0.3).
# `check` and `e2e` are required status checks on main: a pull request with a failing test can't merge.
name: CI

# Push only: a `pull_request` trigger would add skipped runs named `check` and `e2e`, and GitHub
# counts a skipped required check as passed. Pull requests from forks get no CI and can't merge.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright on Chromium with software rendering
        run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

# Tauri desktop builds for Windows and macOS (WP0.3). Each build is kept as a workflow artifact.
# Runs on main, by hand, and on pull requests that touch the shell or this workflow.
# Also weekly, for the Rust advisories check only: new advisories appear without any change here.
# Unsigned until the code-signing certificate and Apple account exist (WP15.4, 15.5).
name: Desktop

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - apps/desktop/**
      - .github/workflows/desktop.yml
      - .github/actions/**
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licences:
    name: licences (rust)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses
          manifest-path: apps/desktop/src-tauri/Cargo.toml

  # Known security advisories (RustSec) in crates on the platforms we ship, as listed in deny.toml.
  advisories:
    name: advisories (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
          manifest-path: apps/desktop/src-tauri/Cargo.toml

  # The school lock (WP15.3) and the gate (WP15.2). No Tauri in these crates, so this is quick,
  # and the policy has per-platform code.
  policy:
    name: policy (${{ matrix.name }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Test the policy, the gate, the transport, the speech models and the pupil folders
        working-directory: apps/desktop/src-tauri
        run: cargo test -p storystage-policy -p storystage-classes -p storystage-gate -p storystage-transport -p storystage-speech --features storystage-transport/test-endpoint --locked

  # Proves the key can't be found in anything the webview can see (spec 05 section 2.7). Spike
  # 1.6's check, on the real app: see apps/desktop/leak-scan/README.md. Windows, where WebView2
  # has a DevTools port to look through.
  leak-scan:
    name: leak scan
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: ./.github/actions/setup
      - name: Fetch the bundled speech model and check its pin (spec 05, 5.2)
        run: node scripts/fetch-models.mjs
      - name: The shipped config has no debugging port
        run: '! grep -q remote-debugging src-tauri/tauri.conf.json'
      - name: Build the test app
        run: pnpm tauri build --debug --no-bundle --features test-endpoint --config leak-scan/tauri.conf.json -- --locked
      - name: Build the key helper
        working-directory: apps/desktop/src-tauri
        run: cargo build -p storystage-transport --features test-endpoint --bin test-key --locked
      - name: Run the app with a random test key, and look inside it
        run: |
          mkdir out
          helper=src-tauri/target/debug/test-key.exe
          "$helper" set out/key.hash
          node leak-scan/make-pins.mjs out/pins.json
          node leak-scan/fake-server.mjs out/key.hash out/server.log 8787 &
          STORYSTAGE_TEST_ENDPOINT=http://127.0.0.1:8787 STORYSTAGE_TEST_PINS=out/pins.json \
            src-tauri/target/debug/storystage-desktop.exe &
          app=$!
          node leak-scan/scan.mjs out out/server.log
          kill "$app" || true
          "$helper" selftest
          "$helper" scan out/report.json out/page.html out/heap.heapsnapshot out/server.log
      - name: Delete the test key
        if: always()
        run: src-tauri/target/debug/test-key.exe delete || true

  build:
    name: desktop (${{ matrix.name }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ''
            rust-targets: ''
            bundles: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          # Universal, because many schools' Macs are still Intel (15.1).
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: |
              apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: ./.github/actions/setup
      - name: Fetch the bundled speech model and check its pin (spec 05, 5.2)
        run: node apps/desktop/scripts/fetch-models.mjs
      - name: Build the app
        run: pnpm --filter @storystage/desktop tauri build ${{ matrix.args }} -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storystage2-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 30

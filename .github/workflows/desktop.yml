# Tauri desktop builds for Windows and macOS (WP0.3). Each build is kept as a workflow artifact.
# Runs on main, by hand, and on pull requests that touch the shell or this workflow.
# Unsigned until the code-signing certificate and Apple account exist (WP15.4, 15.5).
name: Desktop

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - apps/desktop/**
      - .github/workflows/desktop.yml
      - .github/actions/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licences:
    name: licences (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses
          manifest-path: apps/desktop/src-tauri/Cargo.toml

  build:
    name: desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: macos
            os: macos-latest
            bundles: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: ./.github/actions/setup
      - name: Build the app
        run: pnpm --filter @storystage/desktop tauri build -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storystage2-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 30

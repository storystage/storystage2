# WP1 spikes: throwaway code that measures a risk. Not a required check, so a spike can't block
# anyone's merge. Each job keeps its measurements as an artifact for docs/spikes/REPORT.md.
name: Spikes

on:
  push:
    paths:
      - spikes/**
      - .github/workflows/spikes.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spikes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike-1-4:
    name: spike 1.4 (scheduler)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spikes/1.4-scheduler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm exec vitest run
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Measure in Chromium with software rendering
        run: pnpm exec playwright test
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-1.4-results
          path: |
            spikes/1.4-scheduler/playwright-report/
            spikes/1.4-scheduler/test-results/
          retention-days: 30

  spike-1-5:
    name: spike 1.5 (editors)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spikes/1.5-editors
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm exec vitest run
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Both editors in Chromium, with mouse, touch and keyboard
        run: pnpm exec playwright test
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-1.5-results
          path: |
            spikes/1.5-editors/playwright-report/
            spikes/1.5-editors/test-results/
          retention-days: 30

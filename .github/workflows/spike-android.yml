# Spike 1.7: a Babylon.js scene and a Blockly workspace in the Tauri Android app. Builds the APK
# (ARM and x86_64 Chromebooks), runs it on an x86_64 Android emulator with 4 GB of memory, and
# reads the page's result line from the Android log. The APK is kept for the owner's Chromebook.
name: Spike 1.7 (Android)

on:
  push:
    paths:
      - spikes/1.7-android/**
      - spikes/1.2-models/src/**
      - spikes/1.5-editors/src/**
      - .github/workflows/spike-android.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: spike 1.7 (APK and emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: spikes/1.7-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: spikes/1.7-android/src-tauri -> target
      - uses: ./.github/actions/setup
      - name: Build the page
        run: pnpm build
      - name: Build a debug APK (ARM and x86_64)
        run: |
          NDK_HOME="$ANDROID_NDK_LATEST_HOME" pnpm tauri android init --ci
          NDK_HOME="$ANDROID_NDK_LATEST_HOME" pnpm tauri android build --debug --apk --target aarch64 --target x86_64 --ci
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec ls -l {} \;
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-1.7-apk
          path: spikes/1.7-android/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Start an Android emulator (x86_64, 4 GB)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$sdk/sdkmanager" --licenses > /dev/null
          "$sdk/sdkmanager" "system-images;android-34;google_apis;x86_64" "emulator" "platform-tools" > /dev/null
          echo no | "$sdk/avdmanager" create avd -n spike -k "system-images;android-34;google_apis;x86_64"
          nohup "$ANDROID_HOME/emulator/emulator" -avd spike -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && break; sleep 5; done
          adb shell getprop ro.build.version.release
      - name: Install the app, start it, and read its result
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*universal*debug*.apk' | head -1)
          adb install -r "$apk"
          adb logcat -c
          adb shell monkey -p org.storystage.spike.android -c android.intent.category.LAUNCHER 1
          line=""
          for i in $(seq 1 60); do line=$(adb logcat -d | grep -o 'SPIKE17 {.*}' | head -1); [ -n "$line" ] && break; sleep 5; done
          mkdir -p "$RUNNER_TEMP/spike-1.7"
          adb exec-out screencap -p > "$RUNNER_TEMP/spike-1.7/screen.png"
          adb logcat -d > "$RUNNER_TEMP/spike-1.7/logcat.txt"
          echo "${line#SPIKE17 }" > "$RUNNER_TEMP/spike-1.7/result.json"
          cat "$RUNNER_TEMP/spike-1.7/result.json"
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const checks = [["WebGL2", r.webgl === 2], ["the scene animated", r.fps > 0], ["Blockly drew its blocks", r.blocklyBlocks > 0]];
            let bad = 0;
            for (const [n, ok] of checks) { console.log((ok ? "PASS  " : "FAIL  ") + n); if (!ok) bad++; }
            process.exit(bad ? 1 : 0);
          ' "$RUNNER_TEMP/spike-1.7/result.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-1.7-results
          path: ${{ runner.temp }}/spike-1.7/
          retention-days: 30

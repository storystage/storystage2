# Temporary, never merged: there's no Cargo on the development PC, so CI works out Cargo.lock
# for new crates, and the result is committed by hand. Only the workspace's own entries move.
name: Lockfile (temporary)

on:
  push:
    branches: [lane/s8-speech-native]

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Work out the lockfile
        working-directory: apps/desktop/src-tauri
        run: cargo update --workspace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-lock
          path: apps/desktop/src-tauri/Cargo.lock
          retention-days: 3
